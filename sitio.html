    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/carousel/carousel.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/utils/map.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/carousel/carousel.lazyload.umd.js"></script>

    <script>
      Carousel(
        document.getElementById("myCarousel"),
        {
          slidesPerPage: 1,
          on: {
            render: (instance, slides) => {
              for (const slide of slides) {
                const rawProgress = instance.getPageProgress(slide.index);
                const progress = Math.abs(
                  Math.max(-1, Math.min(1, rawProgress))
                );

                const rotateY = map(rawProgress, 0, 1, 0, 30);
                const translateZ = map(progress, 0, 1, 0, -250);
                const scale = map(progress, 0, 1, 1, 1.4);

                slide.el?.style.setProperty(
                  "--f-translateZ",
                  `${translateZ}px`
                );
                slide.el?.style.setProperty("--f-rotateY", `${rotateY}deg`);
                slide.el?.style.setProperty("--f-scale", `${scale}`);
              }
            },
          },
        },
        {
          Lazyload,
        }
      ).init();
    </script>
